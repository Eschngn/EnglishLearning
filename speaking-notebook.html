  <style>
    :root{--bg:#f6f8fc;--surface:#fff;--ink:#172033;--muted:#6f7a90;--line:#e4e9f2;--primary:#536dfb;--primary-soft:#eef0ff;--shadow:0 12px 30px rgba(35,49,86,.08);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
    *{box-sizing:border-box}body{margin:0;color:var(--ink);background:var(--bg);line-height:1.55}button,input{font:inherit}button{cursor:pointer}
    .app-shell{width:min(100% - 32px,1120px);margin:auto;padding:28px 0 50px}header{margin-bottom:26px}.eyebrow{margin:0 0 6px;color:var(--primary);font-size:.82rem;font-weight:750;letter-spacing:.08em}h1,h2,p{margin-top:0}h1{margin-bottom:0;font-size:clamp(1.75rem,4vw,2.6rem);letter-spacing:-.03em}
    .toolbar{display:flex;gap:12px;align-items:center;margin-bottom:22px;scroll-margin-top:16px}.search-box{position:relative;flex:1}.search-box span{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted)}.search-box input{width:100%;border:1px solid var(--line);border-radius:12px;padding:13px 14px 13px 40px;background:var(--surface);outline:0}.search-box input:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(83,109,251,.12)}.stats{display:flex;gap:8px;color:var(--muted);white-space:nowrap;font-size:.9rem}.stats strong{color:var(--ink)}
    .category-tabs{display:flex;gap:8px;margin-bottom:16px;padding:5px;border:1px solid var(--line);border-radius:14px;background:var(--surface);width:max-content}.category-tab{border:0;border-radius:10px;padding:9px 15px;color:var(--muted);background:transparent;font-weight:700}.category-tab:hover{color:var(--ink)}.category-tab.active{color:#3f56dd;background:var(--primary-soft)}
    .word-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(285px,1fr));gap:18px}.word-card{display:flex;flex-direction:column;min-height:320px;padding:22px;border:1px solid var(--line);border-radius:18px;background:var(--surface);box-shadow:var(--shadow)}.card-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}.word{margin-bottom:2px;font-size:1.75rem;letter-spacing:-.03em}.ipa{display:flex;align-items:baseline;gap:6px;margin-bottom:0;color:var(--muted);font-family:"Noto Sans", "Segoe UI", sans-serif;font-size:.98rem;letter-spacing:.02em}.ipa-label{color:#98a1b3;font-family:inherit;font-size:.68rem;font-weight:750;letter-spacing:.08em}.speak-button{display:inline-grid;place-items:center;width:40px;height:40px;border:0;border-radius:50%;color:#3f56dd;background:var(--primary-soft);font-size:1.08rem}.speak-button:hover{background:#e0e4ff}.tags{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0 13px}.tag{padding:4px 9px;border-radius:999px;color:#3f56dd;background:var(--primary-soft);font-size:.78rem;font-weight:700}.meaning{margin-bottom:15px;font-size:1rem}.language-notes{margin-bottom:17px;padding-top:13px;border-top:1px solid var(--line)}.language-notes ul{margin:0;padding-left:19px}.language-notes li{margin:4px 0;color:#3e485c;font-size:.9rem}.language-notes li::marker{color:var(--primary)}.section-label{margin-bottom:5px;color:var(--muted);font-size:.75rem;font-weight:750;letter-spacing:.05em}.example{margin-top:auto;padding:14px;border-left:3px solid var(--primary);border-radius:0 10px 10px 0;background:#fafbff}.example-label{margin-bottom:5px;color:var(--muted);font-size:.75rem;font-weight:750;letter-spacing:.05em;text-transform:uppercase}.example p{margin-bottom:5px;font-size:.98rem;white-space:pre-line}.translation{margin-bottom:0!important;color:var(--muted);font-size:.88rem!important}.empty{grid-column:1/-1;padding:50px 20px;border:1px dashed var(--line);border-radius:18px;color:var(--muted);text-align:center}
    .pagination{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:26px}.page-button{min-width:38px;height:38px;padding:0 11px;border:1px solid var(--line);border-radius:10px;color:var(--ink);background:var(--surface);font-weight:700}.page-button:hover:not(:disabled),.page-button.active{border-color:var(--primary);color:#fff;background:var(--primary)}.page-button:disabled{cursor:not-allowed;opacity:.42}.page-label{margin:0 6px;color:var(--muted);font-size:.9rem}
    @media(max-width:620px){.app-shell{width:min(100% - 22px,1120px);padding-top:20px}header{margin-bottom:20px}.category-tabs{width:100%}.category-tab{flex:1;padding:9px 8px}.toolbar{display:block}.stats{margin-top:10px}.word-card{min-height:0}.pagination{margin-top:20px}.page-label{display:none}}
  </style>

<body>
  <main class="app-shell">
    <header><p class="eyebrow">SPEAKING NOTEBOOK</p><h1>我的口语单词本</h1></header>
    <nav class="category-tabs" aria-label="内容分类"><button class="category-tab active" type="button" data-category="word">单词 <span id="wordCategoryCount"></span></button><button class="category-tab" type="button" data-category="phrase">固定搭配 / 词组 <span id="phraseCategoryCount"></span></button></nav>
    <section class="toolbar" aria-label="内容筛选"><div class="search-box"><span aria-hidden="true">⌕</span><input id="searchInput" type="search" placeholder="搜索当前分类的单词、意思、搭配或用法…" autocomplete="off" /></div><div class="stats"><strong id="wordCount">10</strong> 条记录</div></section>
    <section id="wordGrid" class="word-grid" aria-live="polite"></section><nav id="pagination" class="pagination" aria-label="单词分页"></nav>
  </main>
  <script>
    // 新单词或词组追加到数组末尾，显示时会按添加顺序倒序排列，最新条目在最前面。
    const words = [
      {type:"word",word:"billiards",ipa:"/ˈbɪljɚdz/",part:"名词 noun",meaning:"台球运动；台球（通常指在台球桌上进行的球类运动）",scene:"休闲运动",example:"We play billiards at the club on Friday nights.",translation:"我们周五晚上在俱乐部打台球。"},
      {type:"word",word:"rusty",ipa:"/ˈrʌsti/",part:"形容词 adjective",meaning:"生锈的；（技能）生疏的",scene:"描述物品或技能状态",example:"My French is a little rusty after the break.",translation:"休息一段时间后，我的法语有点生疏了。"},
      {type:"word",word:"drizzling",ipa:"/ˈdrɪzəlɪŋ/",part:"形容词 adjective",meaning:"下着毛毛雨的；细雨蒙蒙的",scene:"描述天气",example:"It’s drizzling, so take an umbrella.",translation:"外面下着毛毛雨，带把伞吧。"},
      {type:"word",word:"upstairs",ipa:"/ˌʌpˈsterz/",part:"副词 adverb",meaning:"在楼上；往楼上",scene:"指示位置或方向",example:"The meeting room is upstairs on the left.",translation:"会议室在楼上左边。"},
      {type:"word",word:"downstairs",ipa:"/ˌdaʊnˈsterz/",part:"副词 adverb",meaning:"在楼下；往楼下",scene:"指示位置或方向",example:"I’ll wait for you downstairs by the entrance.",translation:"我在入口旁的楼下等你。"},
      {type:"word",word:"dizzy",ipa:"/ˈdɪzi/",part:"形容词 adjective",meaning:"头晕的；眩晕的",scene:"描述身体感受",example:"I felt dizzy after standing up too quickly.",translation:"起身太快后我感到头晕。"},
      {type:"word",word:"light-headed",ipa:"/ˌlaɪt ˈhedɪd/",part:"形容词 adjective",meaning:"头晕目眩的；感觉要晕倒的",scene:"描述身体感受",example:"I’m feeling light-headed, so I need to sit down.",translation:"我感觉头晕目眩，需要坐下来。"},
      {type:"word",word:"semester",ipa:"/səˈmestɚ/",part:"名词 noun",meaning:"学期（通常为半年制的一段教学时间）",scene:"校园学习",example:"I’m taking three classes this semester.",translation:"这学期我选了三门课。"},
      {type:"word",word:"campus",ipa:"/ˈkæmpəs/",part:"名词 noun",meaning:"校园；大学校区",scene:"校园生活",example:"There’s a new café on campus.",translation:"校园里新开了一家咖啡馆。"},
      {type:"word",word:"intensity",ipa:"/ɪnˈtensəti/",part:"名词 noun",meaning:"强度；剧烈程度",scene:"描述程度变化",example:"You can adjust the workout intensity on this machine.",translation:"你可以调节这台机器上的锻炼强度。"},
      {type:"phrase",word:"sleep in",ipa:"/sliːp ɪn/",part:"短语 phrasal verb",meaning:"睡懒觉；晚一点起床",scene:"描述作息安排",example:"I’m going to sleep in tomorrow.",translation:"我明天打算睡个懒觉。"},
      {type:"phrase",word:"wash up",ipa:"/wɑːʃ ʌp/",part:"短语 phrasal verb",meaning:"洗漱；洗手洗脸；洗餐具",scene:"日常生活",example:"I’ll wash up before breakfast.",translation:"我吃早餐前先洗漱一下。"},
      {type:"phrase",word:"meet up with",ipa:"/miːt ʌp wɪð/",part:"短语 phrasal verb",meaning:"与某人见面；碰面",scene:"朋友邀约",example:"I’m meeting up with some friends after class.",translation:"下课后我要和几个朋友见面。"},
      {type:"phrase",word:"head out",ipa:"/hed aʊt/",part:"短语 phrasal verb",meaning:"出发；离开（前往某处）",scene:"出门行动",example:"Let’s head out before the traffic gets bad.",translation:"趁交通变得拥堵前我们出发吧。"},
      {type:"phrase",word:"no wonder",ipa:"/noʊ ˈwʌndɚ/",part:"短语 phrase",meaning:"难怪；怪不得",scene:"解释原因",example:"No wonder you’re tired—you barely slept last night.",translation:"难怪你累，你昨晚几乎没睡。"},
      {type:"phrase",word:"wide awake",ipa:"/waɪd əˈweɪk/",part:"短语 adjective phrase",meaning:"完全清醒；毫无睡意",scene:"描述清醒状态",example:"I was wide awake at three in the morning.",translation:"凌晨三点我还完全清醒。"},
      {type:"phrase",word:"end up",ipa:"/end ʌp/",part:"短语 phrasal verb",meaning:"最终；结果（处于某种情况）",scene:"描述最终结果",example:"We ended up staying home because of the rain.",translation:"因为下雨，我们最后待在了家里。"},
      {type:"phrase",word:"get used to",ipa:"/ɡet juːst tuː/",part:"短语 phrase",meaning:"习惯于；适应",scene:"描述适应过程",example:"It took me a few weeks to get used to the new schedule.",translation:"我花了几周才习惯新的作息安排。"},
      {type:"phrase",word:"in a long time / for a long time",ipa:"/ɪn ə lɔːŋ taɪm/ · /fɔːr ə lɔːŋ taɪm/",part:"短语对比 phrase pair",meaning:"区别：in a long time 多用于否定句，表示“很久没有”；for a long time 表示动作或状态持续了很长时间，常用于肯定句。",scene:"表达时间跨度",example:"in a long time: I haven’t been there in a long time.\nfor a long time: I’ve wanted to visit Japan for a long time.",translation:"in a long time：我很久没去那里了。\nfor a long time：我想去日本已经很久了。",speak:"in a long time"},
      {type:"word",word:"braised",ipa:"/breɪzd/",part:"形容词 adjective",meaning:"炖的；焖的；红烧的",scene:"描述烹饪方式",example:"The braised beef is tender and full of flavor.",translation:"这道炖牛肉鲜嫩入味。"},
      {type:"word",word:"appetite",ipa:"/ˈæpətaɪt/",part:"名词 noun",meaning:"食欲；胃口",scene:"谈论饮食感受",example:"The walk gave me a good appetite.",translation:"散步让我胃口大开。"},
      {type:"word",word:"liter",ipa:"/ˈliːtɚ/",part:"名词 noun",meaning:"升；公升（容量单位）",scene:"描述容量",example:"I drink about two liters of water a day.",translation:"我每天大约喝两升水。"},
      {type:"word",word:"forecast",ipa:"/ˈfɔːrkæst/",part:"名词 noun",meaning:"预报；预测",scene:"谈论天气",example:"The forecast says it will rain this afternoon.",translation:"天气预报说今天下午会下雨。"},
      {type:"phrase",word:"on top of that",ipa:"/ɑːn tɑːp əv ðæt/",part:"短语 phrase",meaning:"除此之外；而且；更有甚者",scene:"补充信息",example:"The room was spacious, and on top of that, it had a great view.",translation:"房间很宽敞，而且景色也很棒。"},
      {type:"phrase",word:"loofah soup with eggs",ipa:"/ˈluːfə suːp wɪð eɡz/",part:"短语 noun phrase",meaning:"丝瓜鸡蛋汤",scene:"点餐与介绍菜肴",example:"We made loofah soup with eggs for dinner.",translation:"我们晚餐做了丝瓜鸡蛋汤。"},
      {type:"phrase",word:"go perfectly with rice",ipa:"/ɡoʊ ˈpɝːfɪktli wɪð raɪs/",part:"短语 phrase",meaning:"非常下饭；和米饭是绝配",scene:"评价菜肴搭配",example:"This braised beef goes perfectly with rice.",translation:"这道红烧牛肉非常下饭。"},
      {type:"phrase",word:"jasmine tea",ipa:"/ˈdʒæzmɪn tiː/",part:"短语 noun phrase",meaning:"茉莉花茶",scene:"饮品选择",example:"Would you like a cup of jasmine tea after dinner?",translation:"晚饭后想喝一杯茉莉花茶吗？"},
      {type:"phrase",word:"pack up",ipa:"/pæk ʌp/",part:"短语 phrasal verb",meaning:"收拾；打包；整理行李",scene:"收拾物品",example:"Let’s pack up and head home.",translation:"我们收拾东西回家吧。"},
      {type:"word",word:"grab",ipa:"/ɡræb/",part:"动词 verb",meaning:"拿；取；快速得到（口语）",scene:"日常邀约与行动",example:"Let’s grab a coffee before the meeting.",translation:"开会前我们去喝杯咖啡吧。"},
      {type:"word",word:"Celsius",ipa:"/ˈselsiəs/",part:"名词 noun",meaning:"摄氏度；摄氏温标",scene:"谈论温度",example:"It’s 25 degrees Celsius outside today.",translation:"今天外面是 25 摄氏度。"},
      {type:"word",word:"blow",ipa:"/bloʊ/",part:"动词 / 名词 verb / noun",meaning:"v. 吹；吹动；吹走；吹气；吹奏（乐器）；炸毁；猛击；使震惊或失望；n. 一阵风；吹气；猛击；爆炸；打击或挫折（常指坏消息带来的打击）",scene:"描述风、动作或意外打击",example:"A strong wind blew the door shut. The sudden loss was a heavy blow to the team.",translation:"一阵强风把门吹关了。这次突然的损失对团队是一个沉重的打击。"},
      {type:"word",word:"elevated",ipa:"/ˈeləveɪtɪd/",part:"形容词 adjective",meaning:"升高的；高架的；提高的；（血压、温度、数值等）偏高的；（情绪、语气等）高昂的；高尚的；提升到更高层次的",scene:"描述高度、数值或状态",example:"The doctor said my blood pressure was slightly elevated, so I should get more rest.",translation:"医生说我的血压有些偏高，所以我应该多休息。"},
      {type:"phrase",word:"these past few days",ipa:"/ðiːz pæst fjuː deɪz/",part:"短语 time expression",meaning:"这过去几天；最近这几天（通常指从过去延续到现在的一小段时间）",scene:"谈论最近的情况",example:"I’ve been feeling a little tired these past few days.",translation:"这几天我一直觉得有点累。"},
      {type:"phrase",word:"morning rush",ipa:"/ˈmɔːrnɪŋ rʌʃ/",part:"短语 noun phrase",meaning:"早高峰；早晨的交通拥堵时段；早晨出门前后的忙乱时段",scene:"通勤与日常安排",example:"I leave home early to avoid the morning rush.",translation:"我早点出门，以避开早高峰。"},
      {type:"word",word:"podcasts",ipa:"/ˈpɑːdkæsts/",part:"名词 noun",meaning:"播客；播客节目（podcast 的复数形式）",scene:"媒体与日常收听",example:"I listen to podcasts on my drive home from work.",translation:"我在下班开车回家的路上听播客。"},
      {type:"word",word:"recommendation",ipa:"/ˌrekəmenˈdeɪʃən/",part:"名词 noun",meaning:"推荐；推荐的事物；建议",scene:"分享喜好与建议",example:"Thanks for the recommendation—I really enjoyed the podcast.",translation:"谢谢你的推荐，我真的很喜欢这个播客。"},
      {type:"phrase",word:"stay late",ipa:"/steɪ leɪt/",part:"短语 verb phrase",meaning:"待到很晚；晚走；加班到很晚",scene:"工作与作息安排",example:"I had to stay late at work to finish the report.",translation:"我不得不在公司加班到很晚来完成报告。"},
      {type:"phrase",word:"on my drive home from",ipa:"/ɑːn maɪ draɪv hoʊm frəm/",part:"短语 prepositional phrase",meaning:"在我从……开车回家的路上（from 后接地点、工作或活动）",scene:"通勤与日常收听",example:"I listen to podcasts on my drive home from work.",translation:"我在下班开车回家的路上听播客。"},
      {type:"word",word:"elderly",ipa:"/ˈeldərli/",part:"形容词 adjective",meaning:"年长的；老年人的（较礼貌、正式，常用于描述人）",scene:"描述年龄与照护",example:"The community center offers activities for elderly people.",translation:"社区中心为老年人提供各种活动。"},
      {type:"word",word:"transcript",ipa:"/ˈtrænskrɪpt/",part:"名词 noun",meaning:"文字记录；（访谈、演讲等的）逐字稿；成绩单",scene:"学习与信息记录",example:"I read the transcript of the interview after listening to the podcast.",translation:"听完播客后，我读了那次访谈的文字记录。"},
      {type:"phrase",word:"underground parking lot",ipa:"/ˌʌndərɡraʊnd ˈpɑːrkɪŋ lɑːt/",part:"短语 noun phrase",meaning:"地下停车场",scene:"问路与停车",example:"The underground parking lot is beneath the shopping center.",translation:"地下停车场在购物中心下面。"},
      {type:"phrase",word:"by the time",ipa:"/baɪ ðə taɪm/",part:"短语 conjunction",meaning:"到……时候；等到……时（引出一个时间点或时间从句）",scene:"表达时间先后",example:"By the time we arrived, the movie had already started.",translation:"我们到达时，电影已经开始了。"},
      {type:"phrase",word:"go through",ipa:"/ɡoʊ θruː/",part:"短语 phrasal verb",meaning:"经历；仔细检查；浏览；通过（根据语境有不同含义）",scene:"描述经历与处理信息",example:"She went through the transcript carefully before sharing it.",translation:"她仔细检查了文字记录后才分享出去。"},
      {type:"phrase",word:"make a turn",ipa:"/meɪk ə tɝːn/",part:"短语 verb phrase",meaning:"转弯；转向（常与 left、right 或 U-turn 连用）",scene:"驾驶与问路",example:"Make a right turn at the next intersection.",translation:"在下一个路口右转。"}
    ];
    // 单词展示高频搭配，词组展示相近表达或常用句型。
    const learningNotes = {
      "billiards":["play billiards（打台球）","a game of billiards（一局台球）","a billiards table（台球桌）"],
      "rusty":["get rusty（变得生疏／生锈）","be rusty at something（对某事生疏）","rusty metal（生锈的金属）"],
      "drizzling":["start drizzling（开始下毛毛雨）","still drizzling（仍在下毛毛雨）","drizzle lightly（下着小雨）"],
      "upstairs":["go upstairs（上楼）","live upstairs（住在楼上）","the upstairs bedroom（楼上的卧室）"],
      "downstairs":["go downstairs（下楼）","wait downstairs（在楼下等）","the downstairs bathroom（楼下的洗手间）"],
      "dizzy":["feel dizzy（感到头晕）","get dizzy（开始头晕）","a dizzy spell（一阵眩晕）"],
      "light-headed":["feel light-headed（感到头晕目眩）","become light-headed（变得头晕）","slightly light-headed（有点头晕）"],
      "semester":["this semester（这学期）","the fall semester（秋季学期）","the end of the semester（学期末）"],
      "campus":["on campus（在校园内）","campus life（校园生活）","a college campus（大学校园）"],
      "intensity":["high-intensity exercise（高强度运动）","increase the intensity（提高强度）","the intensity of something（某事的强度）"],
      "sleep in":["sleep late：睡到较晚，强调起床晚","oversleep：睡过头，通常是意外","have a lie-in：睡懒觉，英式英语"],
      "wash up":["freshen up：简单洗漱、梳洗","clean up：清理干净；收拾","do the dishes：洗碗，比 wash up 更常见于美式英语"],
      "meet up with":["meet with：与某人会面，常用于正式场合","get together with：与某人聚一聚","catch up with：见面叙旧、了解近况"],
      "head out":["head to + 地点：前往某地","leave for + 地点：动身去某地","set off：出发，常指开始一段旅程"],
      "no wonder":["No wonder + 句子：难怪……","It’s no wonder that + 句子：……不足为奇","That explains why + 句子：这就解释了为什么……"],
      "wide awake":["be fully awake：完全清醒","stay awake：保持清醒、不睡着","be up：已经起床或还没睡"],
      "end up":["end up doing：最终做了某事","end up + 形容词：最终处于某种状态","end up in/at + 地点：最终到了某处"],
      "get used to":["get used to + 名词／动名词：逐渐习惯","be used to + 名词／动名词：已经习惯","used to + 动词原形：过去常常做某事"],
      "in a long time / for a long time":["lately / recently：最近，常与现在完成时连用","since + 时间点：从某时起一直到现在","over the past + 时间段：在过去的一段时间里"],
      "braised":["braised beef（炖牛肉／红烧牛肉）","slowly braised（慢炖的）","braised in sauce（用酱汁焖制的）"],
      "appetite":["have a good appetite（胃口好）","lose your appetite（失去食欲）","work up an appetite（活动后变得有胃口）"],
      "liter":["a liter of water（一升水）","per liter（每升）","a two-liter bottle（两升装的瓶子）"],
      "forecast":["the weather forecast（天气预报）","the forecast calls for rain（预报说有雨）","according to the forecast（根据预报）"],
      "on top of that":["in addition：此外，语气较正式","besides：况且；此外","what’s more：而且，用于加强补充信息"],
      "loofah soup with eggs":["a bowl of + 汤名：一碗……汤","soup with + 配料：加有……的汤","egg drop soup：蛋花汤"],
      "go perfectly with rice":["go well with：与……很搭","pair well with：与……搭配得好","complement：与……相得益彰，语气较正式"],
      "jasmine tea":["a cup of jasmine tea（一杯茉莉花茶）","brew jasmine tea（冲泡茉莉花茶）","iced jasmine tea（冰茉莉花茶）"],
      "pack up":["pack + 物品 + up：把某物收拾起来","pack your bags：收拾行李，准备离开","wrap up：结束或完成某事"],
      "grab":["grab a coffee（快速喝杯咖啡）","grab a bite（随便吃点东西）","grab someone’s attention（吸引某人的注意）"],
      "Celsius":["degrees Celsius（摄氏度）","measured in Celsius（以摄氏度计量）","convert to Celsius（换算为摄氏度）"],
      "blow":["blow away（吹走；使惊叹）","blow out（吹灭；爆裂）","a heavy blow（沉重的打击）"],
      "elevated":["elevated blood pressure（血压偏高）","an elevated temperature（体温偏高）","an elevated risk（升高的风险）"],
      "these past few days":["over the past few days：在过去几天里","for the past few days：持续了过去几天","lately / recently：最近"],
      "morning rush":["morning rush hour：早高峰时段","evening rush：晚高峰","during rush hour：在交通高峰期"],
      "podcasts":["listen to podcasts（听播客）","a podcast episode（一期播客节目）","host a podcast（主持播客节目）"],
      "recommendation":["make a recommendation（提出建议）","a recommendation for something（对某事物的推荐）","on someone’s recommendation（经某人推荐）"],
      "stay late":["stay late at work：在公司待到很晚","work late：工作到很晚","stay up late：熬夜，强调很晚还没睡"],
      "on my drive home from":["on my way home from：在我从……回家的路上，不限交通方式","during my drive home from：在我从……开车回家的途中","while driving home from：从……开车回家时，后接完整动作"],
      "elderly":["elderly people：老年人，较礼貌的说法","an elderly person：一位老年人","elderly care：老年照护"],
      "transcript":["a transcript of + 内容：……的文字记录","an academic transcript：成绩单","get / read / review a transcript：获取／阅读／查看文字记录"],
      "underground parking lot":["an underground car park：地下停车场，英式英语常用","a parking garage：停车楼／停车库，美式英语常用","park in the lot：把车停在停车场里"],
      "by the time":["by the time + 过去时，主句常用过去完成时：到……时已经……","by the time + 一般现在时，主句可用 will have + 过去分词：到……时将已经……","by then：到那时，后面不直接接从句"],
      "go through":["go through something：经历或仔细检查某事","go through with something：把某事坚持做完","go over something：复习或检查某事，语气更偏向查看细节"],
      "make a turn":["make a left/right turn：左转／右转","take a turn：转弯；轮流做某事，含义取决于语境","make a U-turn：掉头"]
    };
    words.forEach(item=>{item.notes=learningNotes[item.word]||[]});
    const grid=document.querySelector("#wordGrid"),count=document.querySelector("#wordCount"),search=document.querySelector("#searchInput"),toolbar=document.querySelector(".toolbar"),pagination=document.querySelector("#pagination");
    const tabs=document.querySelectorAll("[data-category]"),wordCategoryCount=document.querySelector("#wordCategoryCount"),phraseCategoryCount=document.querySelector("#phraseCategoryCount");
    const pageSize=3;let currentPage=1,currentCategory="word";
    function escapeHTML(value){return String(value).replace(/[&<>'"]/g,char=>({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;",'"':"&quot;"}[char]))}
    function visibleWords(){const q=search.value.trim().toLowerCase();return words.slice().reverse().filter(item=>item.type===currentCategory&&[item.word,item.meaning,item.scene,item.example,...item.notes].join(" ").toLowerCase().includes(q))}
    function updateCategoryCounts(){wordCategoryCount.textContent=`(${words.filter(item=>item.type==="word").length})`;phraseCategoryCount.textContent=`(${words.filter(item=>item.type==="phrase").length})`}
    function render(){const visible=visibleWords(),totalPages=Math.max(1,Math.ceil(visible.length/pageSize));currentPage=Math.min(currentPage,totalPages);const pageWords=visible.slice((currentPage-1)*pageSize,currentPage*pageSize);count.textContent=visible.length;grid.innerHTML=pageWords.length?pageWords.map(item=>`<article class="word-card"><div class="card-top"><div><h2 class="word">${escapeHTML(item.word)}</h2><p class="ipa"><span class="ipa-label">IPA</span><span>${escapeHTML(item.ipa)}</span></p></div><button class="speak-button" type="button" data-speak="${escapeHTML(item.speak||item.word)}" aria-label="播放发音">🔊</button></div><div class="tags"><span class="tag">${escapeHTML(item.part)}</span><span class="tag">${escapeHTML(item.scene)}</span></div><p class="meaning">${escapeHTML(item.meaning)}</p><div class="language-notes"><p class="section-label">${item.type==="word"?"常用搭配":"相似用法"}</p><ul>${item.notes.map(note=>`<li>${escapeHTML(note)}</li>`).join("")}</ul></div><div class="example"><p class="example-label">${item.speak?"区别与场景例句":"场景例句"}</p><p>${escapeHTML(item.example)}</p><p class="translation">${escapeHTML(item.translation)}</p></div></article>`).join(""):"<div class=\"empty\">没有找到匹配的单词。试试其他关键词吧。</div>";pagination.innerHTML=visible.length>pageSize?`<button class="page-button" type="button" data-page="prev" ${currentPage===1?"disabled":""}>上一页</button>${Array.from({length:totalPages},(_,i)=>`<button class="page-button ${i+1===currentPage?"active":""}" type="button" data-page="${i+1}">${i+1}</button>`).join("")}<button class="page-button" type="button" data-page="next" ${currentPage===totalPages?"disabled":""}>下一页</button><span class="page-label">第 ${currentPage} / ${totalPages} 页</span>`:""}
    function scrollToSearch(){toolbar.scrollIntoView({block:"start",behavior:"smooth"})}
    tabs.forEach(tab=>tab.addEventListener("click",()=>{currentCategory=tab.dataset.category;currentPage=1;tabs.forEach(item=>item.classList.toggle("active",item===tab));render();scrollToSearch()}));search.addEventListener("input",()=>{currentPage=1;render()});pagination.addEventListener("click",event=>{const button=event.target.closest("[data-page]");if(!button)return;const totalPages=Math.max(1,Math.ceil(visibleWords().length/pageSize));currentPage=button.dataset.page==="prev"?currentPage-1:button.dataset.page==="next"?currentPage+1:Number(button.dataset.page);currentPage=Math.max(1,Math.min(currentPage,totalPages));render();scrollToSearch()});
    // Prefer a clear, standard female English voice across desktop and mobile devices.
    function getEnglishVoice(){
      const voices=window.speechSynthesis.getVoices();
      const english=voices.filter(voice=>/^en(?:-|_|$)/i.test(voice.lang));
      const femaleNames=/female|jenny|aria|ava|samantha|karen|susan|victoria|moira|fiona|tessa|allison|siri|zira/i;
      const naturalFemale=/jenny|aria|ava|samantha|karen|susan|victoria|moira|fiona|tessa|allison|siri/i;
      const score=voice=>{const name=`${voice.name} ${voice.voiceURI}`;let value=0;if(naturalFemale.test(name))value+=40;if(/natural|online|enhanced|premium/i.test(name))value+=30;if(/^en(?:-|_)US/i.test(voice.lang))value+=15;if(femaleNames.test(name))value+=20;if(/compact|low|male|david|mark|george|alex/i.test(name))value-=25;return value};
      return english.filter(voice=>femaleNames.test(`${voice.name} ${voice.voiceURI}`)).sort((a,b)=>score(b)-score(a))[0]||english.find(voice=>/^en(?:-|_)US/i.test(voice.lang))||english[0]||null;
    }
    let selectedEnglishVoice=null;
    if("speechSynthesis"in window){window.speechSynthesis.addEventListener("voiceschanged",()=>{if(!selectedEnglishVoice)selectedEnglishVoice=getEnglishVoice()})}
    grid.addEventListener("click",event=>{const button=event.target.closest("[data-speak]");if(!button||!("speechSynthesis"in window))return;selectedEnglishVoice=selectedEnglishVoice||getEnglishVoice();window.speechSynthesis.cancel();const utterance=new SpeechSynthesisUtterance(button.dataset.speak);utterance.lang="en-US";utterance.voice=selectedEnglishVoice;utterance.rate=.86;utterance.pitch=1.28;utterance.volume=1;window.speechSynthesis.speak(utterance)});updateCategoryCounts();render();
  </script>
</body>
